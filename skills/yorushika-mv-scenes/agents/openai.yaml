interface:
  display_name: "Yorushika MV Scenes"
  short_description: "保留原图构图，按人物主体添加白色线稿或覆盖头部，横图约16:9、竖图约3:4"
  default_prompt: "Use $yorushika-mv-scenes to preserve my image's composition, add a scene-grounded white sketched protagonist when no human subject exists or cover existing subjects' heads with white scribbles, and apply source-aware MV effects in approximately landscape 16:9 or portrait 3:4 according to the input, saving the image in the workspace-root output folder with a date-title filename."
