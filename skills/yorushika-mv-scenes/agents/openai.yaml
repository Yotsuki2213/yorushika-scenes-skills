interface:
  display_name: "Yorushika MV Scenes"
  short_description: "保留构图，默认添加背身回头、可按场景自行调整动作的潦草白线人物；已有主体保留姿态，整个可见头部覆白线"
  default_prompt: "Use $yorushika-mv-scenes to preserve my image's composition and, if no human subject exists, add a loosely scrawled white protagonist whose default action is facing away and looking naturally back over one shoulder—adapting the action freely to the scene when that default contradicts its sightlines, path, support or narrative (otherwise preserve existing subjects' bodies and poses), cover every entire visible head with dense white scribbles, and apply source-aware MV effects in approximately landscape 16:9 or portrait 3:4 according to the input, saving to the workspace-root output folder with a date-title filename."
