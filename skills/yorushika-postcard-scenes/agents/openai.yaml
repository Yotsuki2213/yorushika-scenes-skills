interface:
  display_name: "Yorushika Postcard Scenes"
  short_description: "将 MV 图按横竖方向排成明信片，先核对日中歌词，再呈现双语对照与原歌名"
  default_prompt: "Use $yorushika-postcard-scenes to analyze my MV image, verify scene-matched Japanese/Chinese lyric pairs and the original song title, then create a 4:3 postcard: landscape artwork above 2 pairs, or portrait artwork on the left with the logo above 4 pairs on the right, Japanese above Chinese in each pair and ——original song title last."
